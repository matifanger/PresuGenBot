services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:4416/',r=>{process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot:
    build: .
    env_file: .env
    depends_on:
      pot-provider:
        condition: service_healthy
    environment:
      - POT_PROVIDER_URL=http://pot-provider:4416
    restart: unless-stopped
